# PromptRiff Configuration Example
# Copy this file to ~/.config/promptriff/config.yaml and update with your settings

models:
  openai:
    api_key: ${OPENAI_API_KEY}
    endpoint: https://api.openai.com/v1
    default_model: gpt-4
    timeout: 30
    max_retries: 3
    
  claude:
    api_key: ${ANTHROPIC_API_KEY}
    endpoint: https://api.anthropic.com/v1
    default_model: claude-3-opus-20240229
    max_tokens_to_sample: 1000
    timeout: 30
    max_retries: 3
    
  gemini:
    api_key: ${GOOGLE_API_KEY}
    endpoint: https://generativelanguage.googleapis.com/v1
    default_model: gemini-pro
    timeout: 30
    max_retries: 3

mcp_tools:
  - name: example_tool
    path: /path/to/mcp/tool
    enabled: true
    config:
      option1: value1
      option2: value2

ui:
  theme: dark
  editor: ${EDITOR}
  diff_syntax_highlighting: true
  max_conversation_display: 1000
  keybindings_mode: vi

database:
  path: ~/.local/share/promptriff/promptriff.db
  backup_on_startup: true
  vacuum_interval_days: 7